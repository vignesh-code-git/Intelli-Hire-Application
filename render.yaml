services:
  - type: web
    name: intellihire-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python seed_jobs.py && python seed_cv_dataset.py
    startCommand: gunicorn intellihire_backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: intellihire-db
          property: connectionString
      # The deployed Vercel frontend. Override in the dashboard to add more
      # origins (comma-separated); settings.py falls back to this same URL if
      # the variable is absent.
      - key: CORS_ALLOWED_ORIGINS
        value: https://intelli-hire-application.vercel.app

databases:
  - name: intellihire-db
    plan: free
